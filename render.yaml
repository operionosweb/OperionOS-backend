services:
  - type: web
    name: operionos-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node index.js
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: RESEND_API_KEY
        sync: false
      - key: CONTACT_FROM_EMAIL
        sync: false
